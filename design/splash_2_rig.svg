  <rect width="1024" height="512" fill="url(#s2Bg)"/>

  <!-- truss -->
  <rect x="0" y="30" width="1024" height="13" fill="#1e2536"/>
  <rect x="0" y="30" width="1024" height="4" fill="#313c56"/>

  <!-- crossing beams: A sweeps right, C sweeps left, B centre -->
