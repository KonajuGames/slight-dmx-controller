  <polygon points="748,42 784,42 712,344 480,344" fill="url(#s2B)"/>
  <polygon points="493,42 529,42 586,344 438,344" fill="url(#s2G)"/>

  <ellipse cx="432" cy="345" rx="150" ry="19" fill="url(#s2P)"/>
  <ellipse cx="596" cy="345" rx="150" ry="19" fill="url(#s2P)"/>

  <!-- fixtures -->
  <g fill="#2b3450">
    <rect x="245" y="40" width="46" height="16" rx="4"/>
    <rect x="488" y="40" width="46" height="16" rx="4"/>
    <rect x="743" y="40" width="46" height="16" rx="4"/>
  </g>

  <!-- wordmark, centred, common baseline y=452 -->
