<svg width="1024" height="512" viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="s2Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="s2R" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d6a" stop-opacity="0.6"/><stop offset="1" stop-color="#ff4d6a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s2G" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.62"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s2B" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37c0ff" stop-opacity="0.58"/><stop offset="1" stop-color="#37c0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="s2P" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s2S" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc24b"/><stop offset="0.5" stop-color="#ff4d8d"/><stop offset="1" stop-color="#37d0ff"/>
