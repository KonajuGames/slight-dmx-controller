<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2b"/>
      <stop offset="1" stop-color="#0b0d15"/>
    </linearGradient>
    <linearGradient id="cSweep" x1="0" y1="0" x2="0.85" y2="0.85">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ffe7ad" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffe7ad" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cLens" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#cBg)"/>
  <!-- beam cone from a fixture in the top-left -->
  <polygon points="26,20 34,20 96,104 40,104" fill="url(#cSweep)"/>
  <circle cx="30" cy="20" r="7" fill="#20263a" stroke="#5b688c" stroke-width="2"/>
  <circle cx="30" cy="20" r="3.4" fill="url(#cLens)"/>
  <!-- spectrum bars -->
  <g>
    <rect x="20"  y="70" width="10" height="38" rx="3" fill="#ff5a4d"/>
    <rect x="34"  y="52" width="10" height="56" rx="3" fill="#ff9d3a"/>
    <rect x="48"  y="60" width="10" height="48" rx="3" fill="#ffe14d"/>
    <rect x="62"  y="38" width="10" height="70" rx="3" fill="#5fe06a"/>
    <rect x="76"  y="56" width="10" height="52" rx="3" fill="#37d0ff"/>
    <rect x="90"  y="46" width="10" height="62" rx="3" fill="#5a7bff"/>
    <rect x="104" y="64" width="10" height="44" rx="3" fill="#b96bff"/>
  </g>
  <rect x="16" y="108" width="102" height="4" rx="2" fill="#2a3350"/>
</svg>
